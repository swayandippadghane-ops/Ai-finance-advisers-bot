{% extends "base.html" %}
{% from "_macros.html" import category_options %}
{% block title %}Edit expense{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Edit expense</h1>
  <form method="post" action="{{ url_for('main.edit_expense', expense_id=expense.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="row">
      <div><label for="amount">Amount ({{ currency }})</label>
        <input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" max="10000000" step="0.01" value="{{ '%.2f' % expense.amount }}" required></div>
      <div><label for="cat">Category</label>
        <select id="cat" name="category" required>{{ category_options(categories, expense.category) }}</select></div>
    </div>
    <label for="date">Date</label>
    <input id="date" name="date" type="date" value="{{ expense.spent_on.isoformat() }}" required>
    <label for="desc">Note (optional)</label>
    <input id="desc" name="description" type="text" maxlength="120" value="{{ expense.description }}">
    <button class="btn" type="submit" data-loading="Saving...">Save changes</button>
    <a class="btn btn-ghost" href="{{ url_for('main.expenses_page', month=expense.spent_on.strftime('%Y-%m')) }}">Cancel</a>
  </form>
</section>
{% endblock %}
